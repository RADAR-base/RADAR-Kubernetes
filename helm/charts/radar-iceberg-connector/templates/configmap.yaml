apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  sink-iceberg.properties: |
    tasks.max=1,
    topics=questionnaire_response,
    iceberg.catalog.ref=main,
    iceberg.catalog.uri=http://radar-nessie.default.svc.cluster.local:19120/api/v2,
    iceberg.catalog.catalog-impl=org.apache.iceberg.nessie.NessieCatalog,
    iceberg.catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO,
    iceberg.catalog.s3.endpoint=http://radar-seaweedfs-s3.default.svc.cluster.local:8333,
    iceberg.catalog.client.region=us-east-1,
    iceberg.catalog.s3.path-style-access=true,
    iceberg.catalog.warehouse=s3://radar-intermediate-storage/,
    iceberg.catalog.s3.access-key-id=eLx2gEe0YKXhC493Jldi,
    iceberg.catalog.s3.secret-access-key=TgrQ13m4W17YzKCfsPX54WSwXS3eBdZtJycoOEdK,
    iceberg.control.topic=iceberg-control-topic,
    iceberg.control.group-id=radar-cg-reset-v21,
    key.converter=org.apache.kafka.connect.converters.ByteArrayConverter,
    value.converter=io.confluent.connect.avro.AvroConverter,
    value.converter.schema.registry.url=http://cp-schema-registry:8081,
    iceberg.tables=default.questionnaire_response,
    iceberg.tables.dynamic-enabled=false,
    iceberg.table.default.questionnaire_response.route-regex=.*,
    iceberg.tables.auto-create-enabled=true

    {{/*-1 means use default configured by the kafka broker*/}}

    config.storage.topic=default.config
    config.storage.replication.factor=1
    offset.storage.topic=default.offsets
    offset.storage.replication.factor=1
    status.storage.topic=default.status
    status.storage.replication.factor=1
    topic.creation.default.replication.factor=1

    # --
    avro.codec=deflate
    errors.tolerance=none
    errors.log.enable=true
    errors.retry.delay.max.ms=60000
    errors.retry.timeout=300000
  healthcheck.sh: |
    #!/bin/sh
    STATUS=$(curl -sf localhost:8083/connectors/radar-iceberg-sink-connector/status | grep -o '\"state\":\"[^\"]*\"')
    if echo "$STATUS" | tr '\\n' ',' | grep -q FAILED; then
      exit 1
    elif [ $(echo "$STATUS" | grep RUNNING | wc -l) -le 1 ]; then
      exit 1
    fi
  add-topics-to-config.sh: |
    #!/usr/bin/env sh
    SOURCE=$1
    TARGET=$2
    set -e
    TOPICS="$(curl -sf {{ .Values.catalogServer.url }}/source-types | jq -r '[to_entries | .[] | select(.key | test("^.*-source-types$")) | .value[].data[].topic] | sort | unique | join(",")')"
    if [ "$TOPICS" == "" ]; then
      echo "No topics found!"
      exit 1
    fi
    sed "s/^topics=.\+\$/\\0,$TOPICS/" "$SOURCE" | sed "s/^topics=\$/\\0$TOPICS/" > "$TARGET"
    echo "Configured the following topics"
    grep "topics=" "$TARGET"
